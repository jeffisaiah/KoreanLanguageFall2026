<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz 3 Dictation Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one centered study card, like a dictation sheet — listen strip on top, 원고지-style answer box below, round progress as a row of cells */
:root{
  --bg:#f3f2ec; --paper:#fffef9; --ink:#1f2a44; --muted:#5d6475; --line:#d9d6c8;
  --accent:#f2c230; --accent-ink:#3a2e00; --grid:#e7a9a0;
  --good:#2f7d4f; --good-bg:#e4f2e8; --bad:#b4372f; --bad-bg:#f8e3e0;
  --display:"Gowun Batang", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171d; --paper:#1d2029; --ink:#ecebe4; --muted:#a2a6b3; --line:#343846;
  --accent:#f2c230; --accent-ink:#2a2100; --grid:#7a4a45;
  --good:#7fd19c; --good-bg:#1d3326; --bad:#f08f86; --bad-bg:#3a2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171d; --paper:#1d2029; --ink:#ecebe4; --muted:#a2a6b3; --line:#343846;
  --accent:#f2c230; --accent-ink:#2a2100; --grid:#7a4a45;
  --good:#7fd19c; --good-bg:#1d3326; --bad:#f08f86; --bad-bg:#3a2220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.75rem;margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.score b{color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cells span{height:8px;border-radius:2px;background:var(--line)}
.cells span.cur{background:var(--accent)}
.cells span.ok{background:var(--good)}
.cells span.no{background:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:20px}
.listen{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play{width:72px;height:72px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .12s}
.play:hover{transform:scale(1.05)}
.play:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.play svg{width:30px;height:30px}
.listen .txt{min-width:0;flex:1}
.listen .txt p{margin:0}
.listen .q{font-weight:600}
.listen .hint{color:var(--muted);font-size:.85rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink)}
label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:8px;border:none;background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.notice{font-size:.85rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;margin:0}
.end h2{font-family:var(--display);font-size:2.4rem;margin:0}
.end ul{margin:0;padding-left:1.1em}
.end li{margin:4px 0}
.end .k{font-family:var(--display);font-weight:700}
details{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.bank{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 14px;margin-top:12px;font-size:.92rem;align-items:center}
.bank div{display:contents}
.bank .rom{font-style:italic;color:var(--ink)}
.bank .en{color:var(--muted);text-align:right}
.bank .k{font-family:var(--display);font-weight:700;font-size:1.05rem}
.bank button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;display:grid}
.bank svg{width:16px;height:16px}
@media (max-width:420px){.bank{font-size:.85rem;gap:6px 10px}}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
.answer{border:1.5px dashed var(--grid);border-radius:8px;min-height:120px;display:grid;place-items:center;padding:16px;text-align:center}
.answer.on{border-style:solid;background:var(--bg)}
.hidden-ans{color:var(--muted);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.answer .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1.2}
.answer p{margin:6px 0 0}
.btn.good{background:var(--good);color:var(--paper)}
.btn.bad{background:var(--bad);color:var(--paper)}
</style>

<div class="wrap">
  <header>
    <h1><small>Korean vocab · Quiz 3</small>이게 뭐예요?</h1>
    <div class="score" id="score">Word <b>1</b> of 10 · <b>0</b> correct</div>
  </header>
  <div class="cells" id="cells" aria-hidden="true"></div>

  <section class="card" id="quiz">
    <div class="listen">
      <button class="play" id="play" aria-label="Play the word">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="txt">
        <p class="q">Tap to hear the word.</p>
        <p class="hint">Write it in Korean on paper with a short meaning, then reveal to check.</p>
      </div>
    </div>
    <div class="chips">
      <button class="chip" id="slow" type="button">Play slower</button>
      <span id="voiceWrap" hidden><select class="chip" id="voice" aria-label="Korean voice"></select></span>
    </div>
    <p class="notice" id="voiceNote" hidden>Your browser doesn't have a Korean voice, so audio may sound off or not play. Try Chrome or Safari.</p>

    <div class="answer" id="answer">
      <div class="hidden-ans" id="hiddenAns">Answer hidden</div>
      <div id="shownAns" hidden>
        <div class="big" lang="ko" id="ansKo"></div>
        <p><b id="ansEn"></b>: <span id="ansDesc"></span></p>
      </div>
    </div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="card end" id="end" hidden></section>

  <details>
    <summary>Study list (all 10 words)</summary>
    <div class="bank" id="bank"></div>
  </details>
</div>

<script>
const WORDS=[
 {ko:"거울",rom:"geo-ul",en:"mirror",desc:"you look at yourself in it (이게 뭐예요? 거울이에요.)"},
 {ko:"비누",rom:"bi-nu",en:"soap",desc:"a bar of soap for washing your hands"},
 {ko:"수건",rom:"su-geon",en:"towel",desc:"dries you off after a shower"},
 {ko:"휴지",rom:"hyu-ji",en:"tissue paper",desc:"tissues or toilet paper"},
 {ko:"칫솔",rom:"chit-sol",en:"toothbrush",desc:"you brush your teeth with it. Said [칟쏠]"},
 {ko:"치약",rom:"chi-yak",en:"toothpaste",desc:"goes on the 칫솔. 치 (tooth) + 약 (medicine)"},
 {ko:"접시",rom:"jeop-si",en:"plate",desc:"a dish you put food on. Said [접씨]"},
 {ko:"컵",rom:"keop",en:"cup",desc:"from \"cup\"; you drink from it"},
 {ko:"숟가락",rom:"sut-ga-rak",en:"spoon",desc:"you eat rice and soup with it. Said [숟까락]; spelled with ㄷ, not ㅅ like 젓가락"},
 {ko:"젓가락",rom:"jeot-ga-rak",en:"chopsticks",desc:"a pair of sticks for eating. Said [젇까락]; spelled with ㅅ, not ㄷ like 숟가락"}
];
const $=id=>document.getElementById(id);
let deck=[],i=0,correct=0,results=[],answered=false,cur=null;

const shuffle=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let koVoice=null,koVoices=[];
const rank=v=>{const n=v.name.toLowerCase();
  return (/natural|online|neural/.test(n)?50:0)+(/premium/.test(n)?40:0)+(/enhanced/.test(n)?30:0)+(/google/.test(n)?25:0)+(v.localService===false?5:0)-(/compact|eloquence|grandma|grandpa|rocko|shelley|flo|reed|sandy/.test(n)?40:0)};
function loadVoices(){
  const v=speechSynthesis.getVoices();
  koVoices=v.filter(x=>/^ko/i.test(x.lang)).sort((a,b)=>rank(b)-rank(a));
  let saved=null;try{saved=localStorage.getItem("koVoice")}catch(e){}
  koVoice=koVoices.find(x=>x.name===saved)||koVoices[0]||null;
  const sel=$("voice");
  sel.innerHTML=koVoices.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  if(koVoice) sel.value=koVoice.name;
  $("voiceWrap").hidden=koVoices.length<2;
  $("voiceNote").hidden=!!koVoice||v.length===0;
}
if("speechSynthesis" in window){try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}else{$("voiceNote").hidden=false}
$("voice").addEventListener("change",e=>{
  koVoice=koVoices.find(x=>x.name===e.target.value)||koVoice;
  try{localStorage.setItem("koVoice",koVoice.name)}catch(err){}
  if(cur) say(cur.ko);
});

function say(text,rate=0.85){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=rate; if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}

function start(list){
  deck=shuffle(list);i=0;correct=0;results=deck.map(()=>null);
  $("end").hidden=true;$("quiz").hidden=false;
  show();
}
function renderCells(){
  $("cells").style.gridTemplateColumns=`repeat(${deck.length},1fr)`;
  $("cells").innerHTML=deck.map((_,k)=>`<span class="${results[k]===true?'ok':results[k]===false?'no':k===i?'cur':''}"></span>`).join("");
  correct=results.filter(r=>r===true).length;
  $("score").innerHTML=`Word <b>${Math.min(i+1,deck.length)}</b> of ${deck.length} · <b>${correct}</b> correct`;
}
function show(){
  cur=deck[i];answered=false;
  $("answer").classList.remove("on");$("hiddenAns").hidden=false;$("shownAns").hidden=true;
  $("actions").innerHTML=`<button class="btn" type="button" id="reveal">Reveal word &amp; meaning</button>`;
  $("reveal").onclick=reveal;
  renderCells();
}
function reveal(){
  answered=true;
  $("ansKo").textContent=cur.ko;$("ansEn").textContent=cur.en;$("ansDesc").textContent=cur.desc;
  $("answer").classList.add("on");$("hiddenAns").hidden=true;$("shownAns").hidden=false;
  $("actions").innerHTML=`<button class="btn good" type="button" id="got">I got it right</button><button class="btn bad" type="button" id="miss">I missed it</button><button class="btn ghost" type="button" id="again">Hear it again</button>`;
  $("got").onclick=()=>mark(true);$("miss").onclick=()=>mark(false);$("again").onclick=()=>say(cur.ko);
}
function mark(ok){results[i]=ok;renderCells();next()}
function next(){
  i++;
  if(i>=deck.length) return finish();
  show(); setTimeout(()=>say(cur.ko),250);
}
function finish(){
  $("quiz").hidden=true;
  const missed=deck.filter((_,k)=>results[k]!==true);
  const e=$("end"); e.hidden=false;
  const pct=Math.round(correct/deck.length*100);
  e.innerHTML=`<div><label>Round done</label><h2>${correct} / ${deck.length}</h2><p style="margin:4px 0 0;color:var(--muted)">${pct===100?"Every word right. You're ready.":pct>=75?'Close. Drill the ones below.':'Keep going. Review the list, then retry the misses.'}</p></div>
    ${missed.length?`<div><label>Review these</label><ul>${missed.map(w=>`<li><span class="k" lang="ko">${w.ko}</span>: ${w.en}</li>`).join("")}</ul></div>`:''}
    <div class="actions">${missed.length?'<button class="btn" type="button" id="retry">Retry missed words</button>':''}<button class="btn ${missed.length?'ghost':''}" type="button" id="fresh">New round (all ${WORDS.length})</button></div>`;
  if($("retry")) $("retry").onclick=()=>{start(missed);say(cur.ko)};
  $("fresh").onclick=()=>{start(WORDS);say(cur.ko)};
  $("end").querySelector(".actions .btn").focus({preventScroll:true});
  $("cells").innerHTML=deck.map((_,k)=>`<span class="${results[k]?'ok':'no'}"></span>`).join("");
  $("score").innerHTML=`Done · <b>${correct}</b> of ${deck.length} correct`;
}

$("play").onclick=()=>say(cur.ko);
$("slow").onclick=()=>say(cur.ko,0.5);

$("bank").innerHTML=WORDS.map((w,k)=>`<div><button type="button" data-k="${k}" aria-label="Play ${w.en}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg></button><span class="k" lang="ko">${w.ko}</span><span class="rom">${w.rom}</span><span class="en">${w.en}</span></div>`).join("");
$("bank").addEventListener("click",e=>{const b=e.target.closest("button");if(b)say(WORDS[b.dataset.k].ko)});

start(WORDS);
</script>
